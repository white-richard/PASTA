[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pasta-slt"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.2,<2",
    "bitsandbytes>=0.46.1",
    "flamingo-pytorch>=0.1.2",
    "hpargparse>=0.14.0",
    "hpman>=0.10",
    "huggingface-hub>=0.34",
    "loguru>=0.7",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
    "peft>=0.17,<1",
    "pillow>=10",
    "psutil>=6",
    "pyyaml>=6",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5",
    "timm>=1.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.66",
    "transformers==5.17.0",
    "vidaug @ git+https://github.com/okankop/vidaug@1c1ddf2640fe4a9171267d64ae5e3bd70c24d54a",
    "wandb>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
pasta-train = "pasta.train_pasta:cli"
ppasta-train = "pasta.train_ppasta:cli"
pasta-extract-features = "pasta.extract_vision_feats:main"
pasta-embed-translations = "pasta.translation_embed:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pasta*"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
